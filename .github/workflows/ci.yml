name: Static validation
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Domain and syntax checks
        run: python tools/quality_gate.py --project .
      - name: Privacy regression
        run: node tools/privacy_test.js
      - name: Sensitive-file scan
        run: python tools/prepublish_check.py
